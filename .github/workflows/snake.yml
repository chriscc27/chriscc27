name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # Corre cada día a medianoche
  workflow_dispatch:       # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # ← Permiso crucial para poder hacer push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: chriscc27
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: 'chore: update snake animation [skip ci]'
          add: 'dist/*.svg'
          push: true
          branch: output
          cwd: ./
          default_author: github_actions